name: Agent 18 Corrector Ultimate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - code-only
          - schema-only
          - security-only
          - python-only
          - json-only
          - docker-only
          - health-check

env:
  HEALTH_THRESHOLD: "80"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  corrector:
    name: Agent 18 Corrector
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # SETUP
      # ============================================================

      - name: Resolve mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "Mode: $MODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.MODE == 'full' || env.MODE == 'code-only' || env.MODE == 'health-check'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        if: env.MODE == 'full' || env.MODE == 'python-only' || env.MODE == 'json-only' || env.MODE == 'schema-only' || env.MODE == 'health-check'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        if: env.MODE == 'full' || env.MODE == 'code-only' || env.MODE == 'health-check'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found"
          fi

          npm install -g prettier typescript eslint dockerfilelint

      - name: Install Python tools
        if: env.MODE == 'full' || env.MODE == 'python-only' || env.MODE == 'json-only' || env.MODE == 'schema-only' || env.MODE == 'health-check'
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort bandit pylint pyright pyyaml

      # ============================================================
      # CODE SCAN: JS / TS / JSX / TSX
      # ============================================================

      - name: TypeScript Check
        id: tsc
        if: env.MODE == 'full' || env.MODE == 'code-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## TypeScript Check" >> "$GITHUB_STEP_SUMMARY"

          if [ -f tsconfig.json ]; then
            npx tsc --noEmit 2>&1 | tee tsc-errors.log || true
            TSC_COUNT=$(grep -c "error TS" tsc-errors.log 2>/dev/null || echo "0")
          else
            TSC_COUNT=0
            echo "No tsconfig.json found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "TSC_ERRORS=$TSC_COUNT" >> "$GITHUB_ENV"
          echo "TypeScript Errors: $TSC_COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: ESLint Scan and Auto-Fix
        id: eslint
        if: env.MODE == 'full' || env.MODE == 'code-only'
        continue-on-error: true
        run: |
          echo "## ESLint Scan" >> "$GITHUB_STEP_SUMMARY"

          if [ -f package.json ]; then
            if [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc ] || [ -f .eslintrc.cjs ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
              npx eslint . --ext .js,.jsx,.ts,.tsx --fix 2>&1 | tee eslint.log || true
            else
              echo "No ESLint config found. Running limited fallback rules." >> "$GITHUB_STEP_SUMMARY"
              npx eslint . --ext .js,.jsx,.ts,.tsx \
                --fix \
                --rule "no-unused-vars: warn" \
                --rule "no-undef: error" \
                2>&1 | tee eslint.log || true
            fi

            ESLINT_COUNT=$(grep -ci "error" eslint.log 2>/dev/null || echo "0")
          else
            ESLINT_COUNT=0
            echo "No package.json found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "ESLINT_ERRORS=$ESLINT_COUNT" >> "$GITHUB_ENV"
          echo "ESLint Issues: $ESLINT_COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Prettier Format
        id: prettier
        if: env.MODE == 'full' || env.MODE == 'code-only'
        continue-on-error: true
        run: |
          echo "## Prettier Format" >> "$GITHUB_STEP_SUMMARY"

          if [ -f package.json ]; then
            npx prettier --write "**/*.{js,jsx,ts,tsx,json,css,md,html,yml,yaml}" --ignore-path .gitignore 2>&1 | tee prettier.log || true
            PRETTIER_ISSUES=$(grep -ci "error" prettier.log 2>/dev/null || echo "0")
          else
            PRETTIER_ISSUES=0
            echo "No package.json found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "PRETTIER_ISSUES=$PRETTIER_ISSUES" >> "$GITHUB_ENV"
          echo "Prettier Issues: $PRETTIER_ISSUES" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # SAFE TEXT CORRECTIONS
      # ============================================================

      - name: Safe Text Corrections
        id: text_safe
        if: env.MODE == 'full' || env.MODE == 'code-only'
        run: |
          echo "## Safe Text Corrections" >> "$GITHUB_STEP_SUMMARY"

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              "I'll": "I will",
              "I'm": "I am",
              "What's": "What is",
              "what's": "what is",
              "can't": "cannot",
              "Can't": "Cannot",
              "won't": "will not",
              "Won't": "Will not",
              "don't": "do not",
              "Don't": "Do not",
              "doesn't": "does not",
              "Doesn't": "Does not",
              "you're": "you are",
              "You're": "You are",
              "we're": "we are",
              "We're": "We are",
              "that's": "that is",
              "That's": "That is",
          }

          allowed = {".ts", ".tsx", ".js", ".jsx", ".md", ".html"}
          skip = {"node_modules", ".next", "dist", "build", ".git", ".venv", "__pycache__"}

          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix not in allowed:
                  continue
              if any(part in skip for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")
              updated = text

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Changed files:")
          for file in changed:
              print(file)
          PY

      # ============================================================
      # PYTHON SCAN
      # ============================================================

      - name: Python Black Format and Isort
        id: python_format
        if: env.MODE == 'full' || env.MODE == 'python-only'
        continue-on-error: true
        run: |
          echo "## Python Format" >> "$GITHUB_STEP_SUMMARY"

          PY_FILES=$(find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/__pycache__/*" | wc -l)

          if [ "$PY_FILES" -gt 0 ]; then
            black . 2>&1 | tee black.log || true
            isort . 2>&1 | tee isort.log || true
            BLACK_ISSUES=$(grep -ci "reformatted" black.log 2>/dev/null || echo "0")
          else
            BLACK_ISSUES=0
            echo "No Python files found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "BLACK_ISSUES=$BLACK_ISSUES" >> "$GITHUB_ENV"
          echo "Python files: $PY_FILES" >> "$GITHUB_STEP_SUMMARY"
          echo "Black reformatted files: $BLACK_ISSUES" >> "$GITHUB_STEP_SUMMARY"

      - name: Python Flake8 Check
        id: flake8
        if: env.MODE == 'full' || env.MODE == 'python-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## Python Flake8" >> "$GITHUB_STEP_SUMMARY"

          PY_FILES=$(find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/__pycache__/*" | wc -l)

          if [ "$PY_FILES" -gt 0 ]; then
            flake8 . --exclude=node_modules,.venv,__pycache__ --output-file=flake8-report.txt || true
            FLAKE8_ERRORS=$(grep -c ":" flake8-report.txt 2>/dev/null || echo "0")
          else
            FLAKE8_ERRORS=0
            echo "No Python files found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "FLAKE8_ERRORS=$FLAKE8_ERRORS" >> "$GITHUB_ENV"
          echo "Flake8 Issues: $FLAKE8_ERRORS" >> "$GITHUB_STEP_SUMMARY"

      - name: Python Bandit Security
        id: bandit
        if: env.MODE == 'full' || env.MODE == 'python-only' || env.MODE == 'security-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## Python Security Bandit" >> "$GITHUB_STEP_SUMMARY"

          PY_FILES=$(find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/__pycache__/*" | wc -l)

          if [ "$PY_FILES" -gt 0 ]; then
            bandit -r . -f json -o bandit-report.json --exclude ./node_modules,./.venv,./__pycache__ || true
            BANDIT_ISSUES=$(python3 -c "import json; print(len(json.load(open('bandit-report.json')).get('results', [])))" 2>/dev/null || echo "0")
          else
            BANDIT_ISSUES=0
            echo "No Python files found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "BANDIT_ISSUES=$BANDIT_ISSUES" >> "$GITHUB_ENV"
          echo "Bandit Issues: $BANDIT_ISSUES" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # JSON AND YAML VALIDATION
      # ============================================================

      - name: JSON and YAML Validation
        id: validation
        if: env.MODE == 'full' || env.MODE == 'json-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## JSON/YAML Validation" >> "$GITHUB_STEP_SUMMARY"

          python3 <<'PY'
          import json
          import yaml
          from pathlib import Path

          json_errors = 0
          yaml_errors = 0

          skip = {"node_modules", ".next", "dist", "build", ".git", ".venv", "__pycache__"}

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skip for part in path.parts):
                  continue

              try:
                  if path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
                  elif path.suffix in {".yml", ".yaml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  if path.suffix == ".json":
                      json_errors += 1
                  else:
                      yaml_errors += 1
                  print(f"{path}: {exc}")

          with open("validation.env", "w") as f:
              f.write(f"JSON_ERRORS={json_errors}\n")
              f.write(f"YAML_ERRORS={yaml_errors}\n")
          PY

          cat validation.env >> "$GITHUB_ENV"
          cat validation.env >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # DOCKERFILE LINTING
      # ============================================================

      - name: Dockerfile Lint
        id: dockerlint
        if: env.MODE == 'full' || env.MODE == 'docker-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## Dockerfile Lint" >> "$GITHUB_STEP_SUMMARY"

          DOCKER_ERRORS=0

          if [ -f Dockerfile ]; then
            dockerfilelint Dockerfile 2>&1 | tee dockerfile-lint.log || true
            DOCKER_ERRORS=$(grep -c "ERROR" dockerfile-lint.log 2>/dev/null || echo "0")
          else
            echo "No Dockerfile found" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f docker-compose.yml ]; then
            if ! python3 -c 'import yaml; yaml.safe_load(open("docker-compose.yml"))' 2>/dev/null; then
              echo "docker-compose.yml YAML syntax error" >> "$GITHUB_STEP_SUMMARY"
              DOCKER_ERRORS=$((DOCKER_ERRORS + 1))
            else
              echo "docker-compose.yml valid" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "DOCKER_ERRORS=$DOCKER_ERRORS" >> "$GITHUB_ENV"
          echo "Docker Errors: $DOCKER_ERRORS" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # SUPABASE / SQL SCHEMA SCAN
      # ============================================================

      - name: Supabase Schema Check
        id: schema
        if: env.MODE == 'full' || env.MODE == 'schema-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## Supabase Schema Check" >> "$GITHUB_STEP_SUMMARY"

          SCHEMA_ERRORS=0
          SCHEMA_WARNINGS=0

          if [ -d "supabase" ]; then
            echo "Found supabase directory" >> "$GITHUB_STEP_SUMMARY"

            if [ -d "supabase/migrations" ]; then
              for f in supabase/migrations/*.sql; do
                [ -f "$f" ] || continue

                if grep -q "VARCHAR.*255" "$f" 2>/dev/null; then
                  echo "Warning: VARCHAR(255) in $f. Consider TEXT." >> "$GITHUB_STEP_SUMMARY"
                  SCHEMA_WARNINGS=$((SCHEMA_WARNINGS + 1))
                fi

                if grep -q "NOT NULL.*DEFAULT NULL" "$f" 2>/dev/null; then
                  echo "Error: NOT NULL with DEFAULT NULL in $f" >> "$GITHUB_STEP_SUMMARY"
                  SCHEMA_ERRORS=$((SCHEMA_ERRORS + 1))
                fi

                if grep -q "CREATE TABLE" "$f" 2>/dev/null && ! grep -q "ENABLE ROW LEVEL SECURITY" "$f" 2>/dev/null; then
                  echo "Warning: possible table without RLS in $f" >> "$GITHUB_STEP_SUMMARY"
                  SCHEMA_WARNINGS=$((SCHEMA_WARNINGS + 1))
                fi
              done
            fi

            if [ ! -f "supabase/seed.sql" ]; then
              echo "Warning: no supabase/seed.sql found" >> "$GITHUB_STEP_SUMMARY"
              SCHEMA_WARNINGS=$((SCHEMA_WARNINGS + 1))
            fi

            if [ -f "supabase/config.toml" ]; then
              echo "Supabase config found" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Warning: no supabase/config.toml found" >> "$GITHUB_STEP_SUMMARY"
              SCHEMA_WARNINGS=$((SCHEMA_WARNINGS + 1))
            fi
          else
            echo "No supabase directory found" >> "$GITHUB_STEP_SUMMARY"
          fi

          SQL_FILES=$(find . -name "*.sql" -not -path "*/node_modules/*" | wc -l)

          echo "SQL files: $SQL_FILES" >> "$GITHUB_STEP_SUMMARY"
          echo "SCHEMA_ERRORS=$SCHEMA_ERRORS" >> "$GITHUB_ENV"
          echo "SCHEMA_WARNINGS=$SCHEMA_WARNINGS" >> "$GITHUB_ENV"
          echo "Schema Errors: $SCHEMA_ERRORS" >> "$GITHUB_STEP_SUMMARY"
          echo "Schema Warnings: $SCHEMA_WARNINGS" >> "$GITHUB_STEP_SUMMARY"

      - name: Database TypeScript Types Check
        id: db_types
        if: env.MODE == 'full' || env.MODE == 'schema-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## DB Types Check" >> "$GITHUB_STEP_SUMMARY"

          DB_TYPES_STALE=false

          if [ -f "src/types/supabase.ts" ] || [ -f "types/supabase.ts" ] || [ -f "lib/database.types.ts" ]; then
            echo "Database types file found" >> "$GITHUB_STEP_SUMMARY"

            LAST_MIGRATION=$(ls -t supabase/migrations/*.sql 2>/dev/null | head -1 || true)
            LAST_TYPE=$(find . -name "*.ts" -path "*/supabase*" 2>/dev/null | head -1 || true)

            if [ -z "$LAST_TYPE" ]; then
              LAST_TYPE=$(find . -name "database.types.ts" 2>/dev/null | head -1 || true)
            fi

            if [ -n "$LAST_MIGRATION" ] && [ -n "$LAST_TYPE" ]; then
              MIG_TIME=$(stat -c %Y "$LAST_MIGRATION" 2>/dev/null || echo "0")
              TYPE_TIME=$(stat -c %Y "$LAST_TYPE" 2>/dev/null || echo "0")

              if [ "$MIG_TIME" -gt "$TYPE_TIME" ]; then
                DB_TYPES_STALE=true
                echo "Migrations newer than types. Types may be stale." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Types appear up-to-date" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            DB_TYPES_STALE=true
            echo "No Supabase TypeScript types found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "DB_TYPES_STALE=$DB_TYPES_STALE" >> "$GITHUB_ENV"

      # ============================================================
      # SECURITY SCAN
      # ============================================================

      - name: Security Scan
        id: security
        if: env.MODE == 'full' || env.MODE == 'security-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## Security Scan" >> "$GITHUB_STEP_SUMMARY"

          SECURITY_ISSUES=0
          SECURITY_WARNINGS=0

          if grep -r "sk_live_" . \
            --include="*.ts" \
            --include="*.js" \
            --include="*.tsx" \
            --include="*.jsx" \
            --include="*.py" \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            2>/dev/null; then
            echo "Found possible live secret key" >> "$GITHUB_STEP_SUMMARY"
            SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
          fi

          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo ".env file committed to repo" >> "$GITHUB_STEP_SUMMARY"
            SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
          fi

          if grep -r "eval(" . \
            --include="*.ts" \
            --include="*.js" \
            --include="*.tsx" \
            --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            2>/dev/null; then
            echo "Warning: eval() detected" >> "$GITHUB_STEP_SUMMARY"
            SECURITY_WARNINGS=$((SECURITY_WARNINGS + 1))
          fi

          if grep -r "new Function(" . \
            --include="*.ts" \
            --include="*.js" \
            --include="*.tsx" \
            --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            2>/dev/null; then
            echo "Warning: new Function() detected" >> "$GITHUB_STEP_SUMMARY"
            SECURITY_WARNINGS=$((SECURITY_WARNINGS + 1))
          fi

          echo "SECURITY_ISSUES=$SECURITY_ISSUES" >> "$GITHUB_ENV"
          echo "SECURITY_WARNINGS=$SECURITY_WARNINGS" >> "$GITHUB_ENV"
          echo "Security Issues: $SECURITY_ISSUES" >> "$GITHUB_STEP_SUMMARY"
          echo "Security Warnings: $SECURITY_WARNINGS" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # BUILD CHECK
      # ============================================================

      - name: Build Check
        id: build
        if: env.MODE == 'full' || env.MODE == 'code-only' || env.MODE == 'health-check'
        continue-on-error: true
        run: |
          echo "## Build Check" >> "$GITHUB_STEP_SUMMARY"

          if [ -f package.json ]; then
            npm run build 2>&1 | tee build.log
            BUILD_STATUS=${PIPESTATUS[0]}
          else
            echo "No package.json found" >> "$GITHUB_STEP_SUMMARY"
            BUILD_STATUS=0
          fi

          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          echo "Build Status: $BUILD_STATUS" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # HEALTH SCORE
      # ============================================================

      - name: Calculate Repo Health Score
        id: health
        run: |
          echo "## Health Score" >> "$GITHUB_STEP_SUMMARY"

          JS_FILES=$(find . \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \) -not -path "*/node_modules/*" -not -path "*/.next/*" | wc -l)
          PY_FILES=$(find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/__pycache__/*" | wc -l)
          SQL_FILES=$(find . -name "*.sql" -not -path "*/node_modules/*" | wc -l)
          JSON_FILES=$(find . -name "*.json" -not -path "*/node_modules/*" -not -path "*/.git/*" | wc -l)
          YAML_FILES=$(find . \( -name "*.yml" -o -name "*.yaml" \) -not -path "*/node_modules/*" -not -path "*/.git/*" | wc -l)
          DOCKER_FILES=$(find . \( -name "Dockerfile" -o -name "docker-compose.yml" \) | wc -l)

          TSC=${TSC_ERRORS:-0}
          ESLINT=${ESLINT_ERRORS:-0}
          PRETTIER=${PRETTIER_ISSUES:-0}
          FLAKE8=${FLAKE8_ERRORS:-0}
          BLACK=${BLACK_ISSUES:-0}
          BANDIT=${BANDIT_ISSUES:-0}
          JSON=${JSON_ERRORS:-0}
          YAML=${YAML_ERRORS:-0}
          DOCKER=${DOCKER_ERRORS:-0}
          SCHEMA=${SCHEMA_ERRORS:-0}
          SECURITY=${SECURITY_ISSUES:-0}
          BUILD=${BUILD_STATUS:-0}

          TOTAL_PENALTY=$((TSC + ESLINT + PRETTIER + FLAKE8 + BLACK + BANDIT + JSON + YAML + DOCKER + SCHEMA + SECURITY + BUILD))
          TOTAL_FILES=$((JS_FILES + PY_FILES + SQL_FILES + JSON_FILES + YAML_FILES + DOCKER_FILES))

          if [ "$TOTAL_FILES" -gt 0 ]; then
            HEALTH=$((100 - TOTAL_PENALTY * 2))
          else
            HEALTH=100
          fi

          if [ "$HEALTH" -lt 0 ]; then
            HEALTH=0
          fi

          if [ "$HEALTH" -lt "$HEALTH_THRESHOLD" ]; then
            HEALTH_FAILED=true
          else
            HEALTH_FAILED=false
          fi

          echo "HEALTH_SCORE=$HEALTH" >> "$GITHUB_ENV"
          echo "HEALTH_FAILED=$HEALTH_FAILED" >> "$GITHUB_ENV"

          echo "Files: $JS_FILES JS/TS, $PY_FILES Python, $SQL_FILES SQL, $JSON_FILES JSON, $YAML_FILES YAML, $DOCKER_FILES Docker" >> "$GITHUB_STEP_SUMMARY"
          echo "Penalties: TS=$TSC, ESLint=$ESLINT, Prettier=$PRETTIER, Flake8=$FLAKE8, Black=$BLACK, Bandit=$BANDIT, JSON=$JSON, YAML=$YAML, Docker=$DOCKER, Schema=$SCHEMA, Security=$SECURITY, Build=$BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo "Health Score: $HEALTH/100" >> "$GITHUB_STEP_SUMMARY"
          echo "Health Failed: $HEALTH_FAILED" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # CREATE FIX PR
      # ============================================================

      - name: Create Fix PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Agent 18: auto-corrected detected issues"
          title: "Agent 18 Corrector - Ultimate Auto-Fix Report"
          branch: agent-18-auto-fix-${{ github.run_id }}
          delete-branch: true
          body: |
            ## Agent 18 - The Corrector Ultimate Report

            | Metric | Value |
            |--------|-------|
            | Mode | `${{ env.MODE }}` |
            | Health Score | `${{ env.HEALTH_SCORE }}/100` |
            | Health Failed | `${{ env.HEALTH_FAILED }}` |
            | TypeScript Errors | `${{ env.TSC_ERRORS }}` |
            | ESLint Issues | `${{ env.ESLINT_ERRORS }}` |
            | Prettier Issues | `${{ env.PRETTIER_ISSUES }}` |
            | Python Black | `${{ env.BLACK_ISSUES }}` |
            | Python Flake8 | `${{ env.FLAKE8_ERRORS }}` |
            | Python Bandit | `${{ env.BANDIT_ISSUES }}` |
            | JSON Errors | `${{ env.JSON_ERRORS }}` |
            | YAML Errors | `${{ env.YAML_ERRORS }}` |
            | Docker Issues | `${{ env.DOCKER_ERRORS }}` |
            | Schema Errors | `${{ env.SCHEMA_ERRORS }}` |
            | Schema Warnings | `${{ env.SCHEMA_WARNINGS }}` |
            | DB Types Stale | `${{ env.DB_TYPES_STALE }}` |
            | Security Issues | `${{ env.SECURITY_ISSUES }}` |
            | Security Warnings | `${{ env.SECURITY_WARNINGS }}` |
            | Build Status | `${{ env.BUILD_STATUS }}` |

            ### Auto-Fixes Applied

            - JavaScript / TypeScript formatting where safe
            - ESLint auto-fix where available
            - Prettier formatting
            - Safe text correction for apostrophe-prone strings
            - Python Black formatting
            - Python isort import sorting

            ### Scanned

            - JavaScript, TypeScript, JSX, TSX
            - Python
            - SQL / Supabase migrations
            - JSON
            - YAML
            - Dockerfile / docker-compose.yml
            - Security markers

            ### Review Required

            This workflow opens a PR instead of pushing fixes directly to main.

            Please review before merging.

            ---

            Agent 18 - Hexagram 18: Work on What Has Been Spoilt  
            Run: `${{ github.run_id }}`

          labels: |
            agent-18
            auto-fix
            needs-review

      # ============================================================
      # CREATE ISSUE FOR CRITICAL ITEMS
      # ============================================================

      - name: Create Issue for Critical Errors
        if: env.SECURITY_ISSUES != '0' || env.SCHEMA_ERRORS != '0' || env.BANDIT_ISSUES != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = []

            if (parseInt(process.env.SECURITY_ISSUES || '0') > 0) {
              issues.push(`Security: ${process.env.SECURITY_ISSUES} issues`)
            }

            if (parseInt(process.env.SCHEMA_ERRORS || '0') > 0) {
              issues.push(`Schema: ${process.env.SCHEMA_ERRORS} errors`)
            }

            if (parseInt(process.env.BANDIT_ISSUES || '0') > 0) {
              issues.push(`Python Security: ${process.env.BANDIT_ISSUES} issues`)
            }

            if (process.env.DB_TYPES_STALE === 'true') {
              issues.push('Database types may be stale')
            }

            const body = [
              '## Agent 18 - Critical Issues Requiring Manual Review',
              '',
              `Health Score: ${process.env.HEALTH_SCORE}/100`,
              '',
              '### Critical',
              '',
              ...issues.map(issue => `- ${issue}`),
              '',
              '### Metrics',
              '',
              `- TypeScript Errors: ${process.env.TSC_ERRORS}`,
              `- ESLint Issues: ${process.env.ESLINT_ERRORS}`,
              `- Prettier Issues: ${process.env.PRETTIER_ISSUES}`,
              `- Python Black: ${process.env.BLACK_ISSUES}`,
              `- Python Flake8: ${process.env.FLAKE8_ERRORS}`,
              `- Python Bandit: ${process.env.BANDIT_ISSUES}`,
              `- JSON Errors: ${process.env.JSON_ERRORS}`,
              `- YAML Errors: ${process.env.YAML_ERRORS}`,
              `- Docker Issues: ${process.env.DOCKER_ERRORS}`,
              `- Schema Errors: ${process.env.SCHEMA_ERRORS}`,
              `- Security Issues: ${process.env.SECURITY_ISSUES}`,
              `- Build Status: ${process.env.BUILD_STATUS}`,
              '',
              '---',
              `Generated by Agent 18 Corrector | Run: ${context.runId}`
            ].join('\n')

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Agent 18: ${issues.length} critical issue groups need review`,
              body,
              labels: ['agent-18', 'auto-generated', 'critical', 'needs-review']
            })

      # ============================================================
      # FAIL IF HEALTH LOW
      # ============================================================

      - name: Fail if Health Below Threshold
        if: env.HEALTH_FAILED == 'true'
        run: |
          echo "Repo health score ${{ env.HEALTH_SCORE }} is below threshold ${{ env.HEALTH_THRESHOLD }}"
          exit 1
