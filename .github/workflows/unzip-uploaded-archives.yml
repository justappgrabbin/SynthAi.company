name: Unzip Uploaded Archives

on:
  push:
    paths:
      - 'uploads/**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip jq

      - name: Unzip uploads and create intake manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          mkdir -p uploads
          manifest="uploads/_manifest.json"
          tmp_manifest="uploads/_manifest.tmp.json"
          echo '[]' > "$tmp_manifest"

          classify_file() {
            local file="$1"
            local lower
            lower=$(echo "$file" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *.tsx|*.jsx) echo "react_component" ;;
              *.ts|*.js|*.mjs|*.cjs) echo "code_module" ;;
              *.html) echo "html_app" ;;
              *.css|*.scss) echo "style" ;;
              *.json|*.toml|*.yml|*.yaml|*.env.example) echo "config" ;;
              *.sql) echo "database_schema" ;;
              *.md|*.txt) echo "document" ;;
              *.onnx|*.pt|*.gguf|*.safetensors) echo "model" ;;
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.svg) echo "asset_image" ;;
              *) echo "asset" ;;
            esac
          }

          for zipfile in uploads/*.zip; do
            found=1
            dir="${zipfile%.zip}"
            zip_name=$(basename "$zipfile")
            echo "Unzipping: $zipfile -> $dir"
            mkdir -p "$dir"
            unzip -o "$zipfile" -d "$dir"
            rm "$zipfile"

            subdirs=$(find "$dir" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            files=$(find "$dir" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')
            if [ "$subdirs" = "1" ] && [ "$files" = "0" ]; then
              subdir=$(find "$dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              echo "Flattening single-root folder: $subdir"
              shopt -s dotglob nullglob
              mv "$subdir"/* "$dir"/ || true
              rmdir "$subdir" || true
            fi

            file_index="[]"
            while IFS= read -r file; do
              rel="${file#./}"
              size=$(wc -c < "$file" | tr -d ' ')
              hash=$(sha256sum "$file" | awk '{print $1}')
              kind=$(classify_file "$file")
              file_index=$(jq \
                --arg path "$rel" \
                --arg kind "$kind" \
                --arg hash "$hash" \
                --argjson size "$size" \
                '. + [{path:$path, kind:$kind, size:$size, sha256:$hash}]' <<< "$file_index")
            done < <(find "$dir" -type f | sort)

            tmp=$(mktemp)
            jq \
              --arg source_zip "$zip_name" \
              --arg extracted_to "$dir" \
              --arg ingested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson files "$file_index" \
              '. + [{source_zip:$source_zip, extracted_to:$extracted_to, ingested_at:$ingested_at, file_count:($files | length), files:$files}]' \
              "$tmp_manifest" > "$tmp"
            mv "$tmp" "$tmp_manifest"
          done

          if [ "$found" = "0" ]; then
            echo "No uploads/*.zip files found. Nothing to extract."
          fi

          if [ -f "$manifest" ]; then
            jq -s 'add' "$manifest" "$tmp_manifest" > uploads/_manifest.merged.json
            mv uploads/_manifest.merged.json "$manifest"
          else
            mv "$tmp_manifest" "$manifest"
          fi

          rm -f "$tmp_manifest"
          echo "Morph intake manifest:"
          jq '.' "$manifest"

      - name: Commit extracted contents and manifest
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Unzip uploaded archives and update Morph intake manifest"
            git push
          fi
