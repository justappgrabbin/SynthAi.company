name: Unzip Uploaded Archives

on:
  push:
    paths:
      - 'uploads/**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip uploads only
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0

          for zipfile in uploads/*.zip; do
            found=1
            dir="${zipfile%.zip}"
            echo "Unzipping: $zipfile -> $dir"
            mkdir -p "$dir"
            unzip -o "$zipfile" -d "$dir"
            rm "$zipfile"

            subdirs=$(find "$dir" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            files=$(find "$dir" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')
            if [ "$subdirs" = "1" ] && [ "$files" = "0" ]; then
              subdir=$(find "$dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              echo "Flattening single-root folder: $subdir"
              shopt -s dotglob nullglob
              mv "$subdir"/* "$dir"/ || true
              rmdir "$subdir" || true
            fi
          done

          if [ "$found" = "0" ]; then
            echo "No uploads/*.zip files found. Nothing to extract."
          fi

      - name: Commit extracted contents
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Unzip uploaded archives [skip ci]"
            git push
          fi
